<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Análisis Electoral</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        /* VARIABLES MODO OSCURO (Default) */
        :root {
            --bg-app: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: rgba(255,255,255,0.1);
            --brand: #60a5fa;
            --success: #34d399;
            --danger: #f87171;
            --nav-bg: rgba(15, 23, 42, 0.8);
            --shadow-card: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --input-bg: rgba(0,0,0,0.2);
            --option-hover: rgba(255,255,255,0.1);
        }

        /* VARIABLES MODO CLARO */
        [data-theme="light"] {
            --bg-app: #f1f5f9;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border: rgba(0,0,0,0.1);
            --brand: #2563eb;
            --success: #059669;
            --danger: #dc2626;
            --nav-bg: rgba(255, 255, 255, 0.9);
            --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --input-bg: rgba(0,0,0,0.05);
            --option-hover: rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; transition: background 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-app);
            color: var(--text-main);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Three.js Background Canvas */
        #bgCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
        }

        .navbar {
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            background: var(--nav-bg);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .btn-action {
            color: var(--text-main); text-decoration: none; display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 20px; background: rgba(125,125,125,0.1); transition: 0.3s; cursor: pointer; border: none; font-size: 1rem;
        }
        .btn-action:hover { background: rgba(125,125,125,0.2); }

        /* SEARCH BAR CUSTOM */
        .custom-select-wrapper { position: relative; width: 300px; margin: 0 20px; }
        .search-input {
            width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--input-bg); color: var(--text-main); outline: none; font-size: 0.9rem;
        }
        .search-input:focus { border-color: var(--brand); box-shadow: 0 0 0 2px rgba(96, 165, 250, 0.2); }
        
        .options-list {
            position: absolute; top: 110%; left: 0; width: 100%; max-height: 300px; overflow-y: auto;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
            box-shadow: var(--shadow-card); display: none; z-index: 200; backdrop-filter: blur(20px);
        }
        .options-list.show { display: block; }
        .option-item { padding: 10px 15px; cursor: pointer; color: var(--text-main); border-bottom: 1px solid var(--border); }
        .option-item:last-child { border-bottom: none; }
        .option-item:hover { background: var(--option-hover); color: var(--brand); }

        .dashboard {
            max-width: 1200px; margin: 20px auto; padding: 0 1rem;
            display: grid; gap: 20px;
        }

        /* KPI Cards */
        .kpi-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;
        }
        .glass-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: var(--shadow-card);
        }
        
        .kpi-title { font-size: 0.8rem; text-transform: uppercase; color: var(--text-sub); letter-spacing: 1px; font-weight: 700; }
        .kpi-value { font-size: 2.5rem; font-weight: 800; margin: 5px 0; color: var(--text-main); }
        .kpi-sub { font-size: 0.9rem; color: var(--text-sub); }
        .t-success { color: var(--success); }
        .t-danger { color: var(--danger); }
        .t-brand { color: var(--brand); }

        /* Charts Layout */
        .charts-row { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media(min-width: 900px) { .charts-row { grid-template-columns: 1fr 2fr; } }

        .chart-container { position: relative; height: 300px; width: 100%; display: flex; align-items: center; justify-content: center;}
        
        h2 { margin-bottom: 15px; font-weight: 300; border-left: 4px solid var(--brand); padding-left: 10px; color: var(--text-main); }

        /* Loading Overlay */
        #loader {
            position: fixed; inset: 0; background: var(--bg-app); z-index: 200;
            display: flex; justify-content: center; align-items: center; font-size: 1.2rem; color: var(--text-sub);
        }
    </style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<!-- Loader Inicial -->
<div id="loader" style="display:none">Procesando datos...</div>

<nav class="navbar">
    <a href="index.html" class="btn-action"><i class="ph ph-house"></i> Inicio</a>
    
    <!-- BUSCADOR CENTRAL -->
    <div class="custom-select-wrapper">
        <input type="text" id="muniSearchInput" class="search-input" placeholder="Buscar municipio..." autocomplete="off">
        <div id="muniOptionsList" class="options-list"></div>
    </div>

    <div style="display:flex; gap:15px; align-items:center;">
        <div style="text-align: right; display:none; flex-direction:column; align-items:flex-end;" id="headerInfo">
            <div style="font-size:0.8rem; color:var(--text-sub)">VISTA ACTUAL</div>
            <div style="font-weight:700; font-size:1rem; color:var(--text-main); text-transform:uppercase" id="currentMuniLabel">Seleccione</div>
        </div>
        <button class="btn-action" onclick="toggleThemeStats()"><i class="ph ph-moon" id="themeIcon"></i></button>
    </div>
</nav>

<div class="dashboard" id="dashboardContent" style="opacity: 0.5; pointer-events:none; filter: grayscale(1);">
    <!-- KPIS -->
    <div class="kpi-grid">
        <div class="glass-card">
            <div class="kpi-title">Avance Escrutinio</div>
            <div class="kpi-value" id="kpiEscrutado">0%</div>
            <div class="kpi-sub"><span id="txtMesasEsc">0</span> de <span id="txtMesasTot">0</span> Mesas</div>
        </div>
        <div class="glass-card">
            <div class="kpi-title">Reclamaciones</div>
            <div class="kpi-value t-danger" id="kpiReclamos">0</div>
            <div class="kpi-sub">Mesas con impugnaciones</div>
        </div>
        <div class="glass-card">
            <div class="kpi-title">Novedades</div>
            <div class="kpi-value t-success" id="kpiNovedades">0</div>
            <div class="kpi-sub">Reportes en E-14</div>
        </div>
        <div class="glass-card">
            <div class="kpi-title">Faltantes</div>
            <div class="kpi-value t-brand" id="kpiFaltantes">0</div>
            <div class="kpi-sub">Mesas por procesar</div>
        </div>
    </div>

    <!-- GRÁFICOS -->
    <div class="charts-row">
        <div class="glass-card">
            <h2>Progreso Global</h2>
            <div class="chart-container">
                <canvas id="doughnutChart"></canvas>
            </div>
        </div>
        <div class="glass-card">
            <h2>Reclamaciones por Zona/Puesto</h2>
            <div class="chart-container">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    // --- VARIABLES GLOBALES ---
    let doughnutChart = null;
    let barChart = null;
    let threeParticles = null;
    let threeSphere = null;
    let currentDataGlobal = null;

    const municipios = [
        { name: "POPAYAN", url: "https://docs.google.com/spreadsheets/d/1-Pmx3R9MD0MvtkSGHiKlOCsmmhjNtWCdWRy9NyfIshY/edit?usp=drive_link" },
        { name: "CAJIBIO", url: "https://docs.google.com/spreadsheets/d/1D4xh8f-n2UmrdC-fGH6E3gtL8j7ycTFbEb5wnkI-VzQ/edit?usp=drive_link" },
        { name: "CALOTO", url: "https://docs.google.com/spreadsheets/d/195-zmz4c7HbGn0ngBaL4yDUJ-lR4DA69hkywy2InCbE/edit?usp=drive_link" },
        { name: "CORINTO", url: "https://docs.google.com/spreadsheets/d/1kZofOxvM7VKotXS5JW4xB0-B9c_utM0sAiZq6y-FhtM/edit?usp=drive_link" },
        { name: "EL TAMBO", url: "https://docs.google.com/spreadsheets/d/1DIwcx_j6VHTeRBIdn4EKAR-rBTBOlQ7ePt3Zy6AIYaU/edit?usp=drive_link" },
        { name: "GUACHENE", url: "https://docs.google.com/spreadsheets/d/1ytmK4aX6rVJVbtGQKtxBHUt2cQm93fH560Kw08A35Qs/edit?usp=drive_link" },
        { name: "LA SIERRA", url: "https://docs.google.com/spreadsheets/d/19wbJPPcvSEq6I6AAX850QjZGO44DLaZyedMZGQGjKAg/edit?usp=drive_link" },
        { name: "MERCADERES", url: "https://docs.google.com/spreadsheets/d/1rbzqJDePpYAaw1_-WnGdbEAxoIY_1QO3nsMWp8nirPY/edit?usp=drive_link" },
        { name: "MIRANDA", url: "https://docs.google.com/spreadsheets/d/1ViRjM0fTcNmg5piYUxS12bHst6a2EExlI-0aTtOL59I/edit?usp=drive_link" },
        { name: "MORALES", url: "https://docs.google.com/spreadsheets/d/1x1UHjJyqsF8KCdRtFXNnnEjqwPvCXBvIteCU8oCVX-Y/edit?usp=drive_link" },
        { name: "PATIA (BORDO)", url: "https://docs.google.com/spreadsheets/d/15I-sFAN8vCdjjAgvU1-KYgEuLO0PoYZSCehLbpbGoSk/edit?usp=drive_link" },
        { name: "PIENDAMO", url: "https://docs.google.com/spreadsheets/d/12FzAJJ1AUfj0M4hb3vKYYMyHa617pXn-Y7f-qHCcnsw/edit?usp=drive_link" },
        { name: "PUERTO TEJADA", url: "https://docs.google.com/spreadsheets/d/1dD38hBH5LrTjaor4sN66H2rbxLjqQfUdeYMrn8Muo4o/edit?usp=drive_link" },
        { name: "ROSAS", url: "https://docs.google.com/spreadsheets/d/1aZnMfa_aQCgrTkmL38F3b_q4K-FmsDTu2E-4hT7cJDs/edit?usp=drive_link" },
        { name: "SANTANDER", url: "https://docs.google.com/spreadsheets/d/1J9RydTcOo7KYptiojLvyoAhTvm1NbDjgzevlIOO6-S4/edit?usp=drive_link" },
        { name: "SUCRE", url: "https://docs.google.com/spreadsheets/d/1tcCb721Fm18l7H3Hi1bizmjbjAPEJ5IpsYIm1iO-zDM/edit?usp=drive_link" },
        { name: "TIMBIO", url: "https://docs.google.com/spreadsheets/d/1epDUpM6Ocw-R_3CggSfzgZILq2c7C2cueBArXKG6emQ/edit?usp=drive_link" },
        { name: "VILLA RICA", url: "https://docs.google.com/spreadsheets/d/1IJugGUsq5TJoTP79O8yvcHHi6yMeHLoG8tDEP7PmYJA/edit?usp=drive_link" }
    ];

    // --- 1. CONFIGURACIÓN TEMA ---
    function initTheme() {
        const savedTheme = localStorage.getItem('theme') || 'dark';
        applyTheme(savedTheme);
    }

    function toggleThemeStats() {
        const current = document.body.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        const newTheme = current === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
    }

    function applyTheme(theme) {
        const icon = document.getElementById('themeIcon');
        if (theme === 'light') {
            document.body.setAttribute('data-theme', 'light');
            icon.classList.remove('ph-moon'); icon.classList.add('ph-sun');
        } else {
            document.body.removeAttribute('data-theme');
            icon.classList.remove('ph-sun'); icon.classList.add('ph-moon');
        }
        localStorage.setItem('theme', theme);
        
        updateThreeJSColor(theme);
        if(currentDataGlobal) calculateAndRender(currentDataGlobal);
    }

    // --- 2. LOGICA DE SELECCION Y BUSQUEDA ---
    function initDropdown() {
        const input = document.getElementById('muniSearchInput');
        const list = document.getElementById('muniOptionsList');
        
        // Renderizar opciones iniciales
        renderOptions(municipios);

        // Evento Input
        input.addEventListener('keyup', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = municipios.filter(m => m.name.toLowerCase().includes(term));
            renderOptions(filtered);
            list.classList.add('show');
        });

        // Evento Focus
        input.addEventListener('focus', () => {
            list.classList.add('show');
        });

        // Click fuera para cerrar
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.custom-select-wrapper')) {
                list.classList.remove('show');
            }
        });
    }

    function renderOptions(options) {
        const list = document.getElementById('muniOptionsList');
        list.innerHTML = '';
        if(options.length === 0) {
            list.innerHTML = '<div style="padding:10px; color:var(--text-sub)">No encontrado</div>';
            return;
        }
        options.forEach(m => {
            const div = document.createElement('div');
            div.className = 'option-item';
            div.innerText = m.name;
            div.onclick = () => selectMunicipio(m);
            list.appendChild(div);
        });
    }

    async function selectMunicipio(muniObj) {
        // UI Updates
        document.getElementById('muniSearchInput').value = muniObj.name;
        document.getElementById('muniOptionsList').classList.remove('show');
        document.getElementById('currentMuniLabel').innerText = muniObj.name;
        document.getElementById('headerInfo').style.display = 'flex';
        
        // Activar Dashboard UI
        const dash = document.getElementById('dashboardContent');
        dash.style.opacity = "1";
        dash.style.pointerEvents = "all";
        dash.style.filter = "none";

        // Cargar Datos
        document.getElementById('loader').style.display = 'flex';
        
        const csvUrl = muniObj.url.includes('/d/') 
            ? `https://docs.google.com/spreadsheets/d/${muniObj.url.split('/d/')[1].split('/')[0]}/export?format=csv`
            : null;

        if(!csvUrl) {
            document.getElementById('loader').innerText = "URL Inválida";
            return;
        }

        try {
            const resp = await fetch(csvUrl);
            const text = await resp.text();
            const rows = parseCSV(text).slice(1).map(r => ({
                zona: r[1], puesto: r[2], mesa: r[3],
                linkReclamacion: r[7], novAsamblea: r[8], novConcejo: r[9],
                uniqueId: (r[0] || r[4]) + '-' + r[3]
            })).filter(i => i.mesa);
            
            currentDataGlobal = rows;
            calculateAndRender(rows);
            document.getElementById('loader').style.display = 'none';
        } catch(e) {
            console.error(e);
            document.getElementById('loader').innerText = "Error cargando datos.";
        }
    }

    // --- 3. PARSING Y RENDERIZADO ---
    function parseCSV(text) {
        const rows = []; let currentRow = []; let currentVal = ''; let inQuotes = false;
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"') { inQuotes = !inQuotes; }
            else if (char === ',' && !inQuotes) { currentRow.push(currentVal.trim()); currentVal = ''; }
            else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (currentVal || currentRow.length > 0) currentRow.push(currentVal.trim());
                if (currentRow.length) rows.push(currentRow);
                currentRow = []; currentVal = '';
            } else { currentVal += char; }
        }
        return rows;
    }

    function calculateAndRender(data) {
        const storedChecks = JSON.parse(localStorage.getItem('escrutadoStatus') || '{}');
        const isLight = document.body.getAttribute('data-theme') === 'light';
        const textColor = isLight ? '#64748b' : '#94a3b8';
        const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.05)';

        // KPIs
        const totalMesas = data.length;
        const escrutadas = data.filter(d => storedChecks[d.uniqueId]).length;
        const faltantes = totalMesas - escrutadas;
        const porcentaje = totalMesas > 0 ? Math.round((escrutadas / totalMesas) * 100) : 0;
        const reclamos = data.filter(d => d.linkReclamacion && d.linkReclamacion.length > 5).length;
        const novedades = data.filter(d => (d.novAsamblea && d.novAsamblea.length > 1) || (d.novConcejo && d.novConcejo.length > 1)).length;

        document.getElementById('kpiEscrutado').innerText = porcentaje + '%';
        document.getElementById('txtMesasEsc').innerText = escrutadas;
        document.getElementById('txtMesasTot').innerText = totalMesas;
        document.getElementById('kpiReclamos').innerText = reclamos;
        document.getElementById('kpiNovedades').innerText = novedades;
        document.getElementById('kpiFaltantes').innerText = faltantes;

        // DONUT CHART
        if(doughnutChart) doughnutChart.destroy();
        const ctxD = document.getElementById('doughnutChart').getContext('2d');
        doughnutChart = new Chart(ctxD, {
            type: 'doughnut',
            data: {
                labels: ['Escrutado', 'Pendiente'],
                datasets: [{
                    data: [escrutadas, faltantes],
                    backgroundColor: isLight ? ['#2563eb', '#cbd5e1'] : ['#3b82f6', '#1e293b'],
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { color: textColor } } },
                cutout: '70%'
            }
        });

        // BAR CHART
        const counts = {};
        data.forEach(d => {
            if(d.linkReclamacion && d.linkReclamacion.length > 5) {
                const key = d.zona ? `Zona ${d.zona}` : d.puesto;
                counts[key] = (counts[key] || 0) + 1;
            }
        });
        const labels = Object.keys(counts);
        const values = Object.values(counts);

        if(barChart) barChart.destroy();
        const ctxB = document.getElementById('barChart').getContext('2d');
        
        if(labels.length === 0) {
            // No destruir el canvas, solo limpiar
            ctxB.clearRect(0, 0, ctxB.canvas.width, ctxB.canvas.height);
            // Mostrar texto simple si no hay datos
            // Pero ChartJS maneja arrays vacíos bien, solo no dibuja barras.
            // Para feedback visual podríamos ocultar el canvas, pero lo dejamos vacío.
        } 
        
        barChart = new Chart(ctxB, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Reclamaciones',
                    data: values,
                    backgroundColor: isLight ? '#dc2626' : '#ef4444',
                    borderRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor } },
                    x: { grid: { display: false }, ticks: { color: textColor } }
                }
            }
        });
    }

    // --- 4. THREE.JS BACKGROUND ---
    function initThreeJS() {
        const canvas = document.getElementById('bgCanvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        camera.position.z = 30;

        // Partículas
        const geometry = new THREE.BufferGeometry();
        const count = 500;
        const positions = new Float32Array(count * 3);
        for(let i=0; i<count*3; i++) positions[i] = (Math.random() - 0.5) * 70;
        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        
        const material = new THREE.PointsMaterial({ size: 0.2, color: 0x60a5fa });
        threeParticles = new THREE.Points(geometry, material);
        scene.add(threeParticles);

        // Esfera wireframe
        const lineGeo = new THREE.WireframeGeometry(new THREE.IcosahedronGeometry(20, 1));
        const lineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.1 });
        threeSphere = new THREE.LineSegments(lineGeo, lineMat);
        scene.add(threeSphere);

        function animate() {
            requestAnimationFrame(animate);
            threeParticles.rotation.y += 0.001;
            threeSphere.rotation.y -= 0.002;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    function updateThreeJSColor(theme) {
        if(!threeParticles || !threeSphere) return;
        if(theme === 'light') {
            threeParticles.material.color.setHex(0x2563eb); 
            threeSphere.material.color.setHex(0x94a3b8);
            threeSphere.material.opacity = 0.1;
        } else {
            threeParticles.material.color.setHex(0x60a5fa); 
            threeSphere.material.color.setHex(0x3b82f6);
            threeSphere.material.opacity = 0.1;
        }
    }

    // INICIALIZACION
    initTheme();
    initDropdown();
    initThreeJS();

    // Cargar automáticamente si hay uno seleccionado en localStorage (opcional, pero buena UX)
    const storedMuni = localStorage.getItem('selectedMunicipio');
    if(storedMuni) {
        const preSelected = municipios.find(m => m.name === storedMuni);
        if(preSelected) {
            document.getElementById('muniSearchInput').value = preSelected.name;
            selectMunicipio(preSelected);
        }
    }

</script>
</body>
</html>
