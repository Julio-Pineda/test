<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor Electoral 2.0</title>
    <style>
        /* Variables CSS para manejo de Temas */
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --accent: #e74c3c; /* Rojo para alertas */
            --bg: #f4f6f7;
            --card-bg: #ffffff;
            --text: #333333;
            --text-light: #7f8c8d;
            --border: #dddddd;
            --modal-overlay: rgba(0,0,0,0.6);
            --shadow: rgba(0,0,0,0.1);
        }

        /* Tema Oscuro */
        [data-theme="dark"] {
            --primary: #1a252f;
            --secondary: #2980b9;
            --accent: #e74c3c;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text: #e0e0e0;
            --text-light: #a0a0a0;
            --border: #333333;
            --modal-overlay: rgba(0,0,0,0.8);
            --shadow: rgba(0,0,0,0.5);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body { background-color: var(--bg); color: var(--text); padding-bottom: 50px; }

        /* Header */
        header {
            background: var(--primary);
            color: white;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        header h1 { font-size: 1.2rem; font-weight: 600; }
        
        /* Botón Modo Oscuro */
        .theme-toggle {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 1.2rem;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.2); }

        /* Buscador */
        .search-container {
            max-width: 800px;
            margin: 1rem auto;
            padding: 0 1rem;
        }
        #searchInput {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            font-size: 16px;
            box-shadow: 0 2px 4px var(--shadow);
        }

        /* Lista de Tarjetas */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px var(--shadow);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid var(--secondary);
            position: relative;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--shadow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge {
            background: var(--bg);
            border: 1px solid var(--border);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--text);
        }

        .mesa-badge {
            background: var(--secondary);
            color: white;
            border: none;
        }

        .card-main-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }

        /* PUNTO ROJO DE ALERTA */
        .alert-dot {
            height: 12px;
            width: 12px;
            background-color: var(--accent);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* Loading */
        .loader {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(3px);
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text);
            width: 95%;
            max-width: 900px;
            height: 90vh;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: slideUp 0.3s ease-out;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            padding: 15px;
            background: var(--primary);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Detalles y Novedades */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            background: var(--bg);
            padding: 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
        }
        
        .novedad-box {
            border-left: 3px solid var(--accent);
            padding-left: 10px;
            margin-top: 10px;
        }
        .novedad-label { font-weight: bold; color: var(--accent); display: block; margin-bottom: 4px;}

        /* Tabs para PDF */
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 10px;
        }
        .tab-btn {
            padding: 10px 15px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-light);
            border-bottom: 3px solid transparent;
            transition: 0.3s;
        }
        .tab-btn:hover { color: var(--secondary); }
        .tab-btn.active {
            color: var(--secondary);
            border-bottom: 3px solid var(--secondary);
        }
        .tab-content {
            display: none;
            flex: 1;
            min-height: 300px;
            background: #eee; /* Iframe bg stays light for contrast */
            border-radius: 4px;
            position: relative;
        }
        .tab-content.active {
            display: block;
            height: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            min-height: 400px;
            background: white;
        }

        .fallback-link {
            padding: 20px;
            text-align: center;
            color: #333;
        }
        .btn-link {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--secondary);
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        @media (min-width: 768px) {
            .info-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>Resultados Electorales</h1>
    <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar Tema">
        <span id="themeIcon">🌙</span>
    </button>
</header>

<div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar por puesto, mesa o código...">
</div>

<div id="loading" class="loader">Cargando datos de la nube...</div>
<div id="listContainer" class="container"></div>

<!-- MODAL -->
<div id="modal" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-header">
            <h3 id="modalTitle">Detalle</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            
            <!-- Sección Informativa -->
            <div class="info-grid">
                <div>
                    <strong>Zona:</strong> <span id="mZona"></span> | 
                    <strong>Puesto:</strong> <span id="mPuesto"></span>
                </div>
                <div>
                    <strong>Mesa:</strong> <span class="badge mesa-badge" id="mMesa"></span>
                </div>
                <div style="grid-column: 1/-1;">
                    <div id="novAsambleaContainer" class="novedad-box">
                        <span class="novedad-label">Novedades Asamblea:</span>
                        <span id="novAsamblea">Ninguna</span>
                    </div>
                    <div id="novConcejoContainer" class="novedad-box">
                        <span class="novedad-label">Novedades Concejo:</span>
                        <span id="novConcejo">Ninguna</span>
                    </div>
                     <div id="reclamoContainer" class="novedad-box" style="display:none; border-color: #f39c12;">
                        <span class="novedad-label" style="color:#f39c12;">Reclamación Detectada:</span>
                        <span>Existe un documento de reclamación adjunto.</span>
                    </div>
                </div>
            </div>

            <!-- Visor de Documentos -->
            <div style="flex: 1; display: flex; flex-direction: column;">
                <div class="tabs">
                    <button class="tab-btn active" onclick="openTab('tabE14Concejo')">E14 Concejo</button>
                    <button class="tab-btn" onclick="openTab('tabE14Asamblea')">E14 Asamblea</button>
                    <button class="tab-btn" onclick="openTab('tabReclamacion')">Reclamación</button>
                </div>

                <div id="tabE14Concejo" class="tab-content active"></div>
                <div id="tabE14Asamblea" class="tab-content"></div>
                <div id="tabReclamacion" class="tab-content"></div>
            </div>

        </div>
    </div>
</div>

<script>
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/1epDUpM6Ocw-R_3CggSfzgZILq2c7C2cueBArXKG6emQ/export?format=csv';
    let allData = [];

    // --- 0. Manejo de Tema (Dark Mode) ---
    function toggleTheme() {
        const body = document.body;
        const icon = document.getElementById('themeIcon');
        if (body.getAttribute('data-theme') === 'dark') {
            body.removeAttribute('data-theme');
            icon.innerText = '🌙';
            localStorage.setItem('theme', 'light');
        } else {
            body.setAttribute('data-theme', 'dark');
            icon.innerText = '☀️';
            localStorage.setItem('theme', 'dark');
        }
    }
    // Cargar preferencia
    if (localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
        document.getElementById('themeIcon').innerText = '☀️';
    }

    // --- 1. Lógica de Parseo CSV ---
    function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentVal = '';
        let inQuotes = false;
        
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i+1];

            if (inQuotes) {
                if (char === '"' && nextChar === '"') {
                    currentVal += '"';
                    i++;
                } else if (char === '"') {
                    inQuotes = false;
                } else {
                    currentVal += char;
                }
            } else {
                if (char === '"') {
                    inQuotes = true;
                } else if (char === ',') {
                    currentRow.push(currentVal.trim());
                    currentVal = '';
                } else if (char === '\n' || char === '\r') {
                    if (currentVal || currentRow.length > 0) {
                        currentRow.push(currentVal.trim());
                        rows.push(currentRow);
                    }
                    currentRow = [];
                    currentVal = '';
                    if (char === '\r' && nextChar === '\n') i++;
                } else {
                    currentVal += char;
                }
            }
        }
        if (currentVal || currentRow.length > 0) {
            currentRow.push(currentVal.trim());
            rows.push(currentRow);
        }
        return rows;
    }

    // --- 2. Obtención de Datos ---
    async function fetchData() {
        try {
            const response = await fetch(SHEET_URL);
            const text = await response.text();
            const rawRows = parseCSV(text);
            
            // Estructura CSV: 0:Codigo, 1:Zona, 2:Puesto, 3:Mesa, 4:Nombre, 5:LinkC, 6:LinkA, 7:LinkR, 8:NovA, 9:NovC
            allData = rawRows.slice(1).map(r => ({
                codigo: r[0],
                zona: r[1],
                puesto: r[2],
                mesa: r[3],
                nombre: r[4],
                linkConcejo: r[5],
                linkAsamblea: r[6],
                linkReclamacion: r[7],
                novAsamblea: r[8],
                novConcejo: r[9]
            })).filter(item => item.mesa); 

            renderList(allData);
            document.getElementById('loading').style.display = 'none';

        } catch (error) {
            console.error(error);
            document.getElementById('loading').innerHTML = 'Error cargando datos. Verifique conexión.';
        }
    }

    // --- 3. Renderizado de Lista ---
    function renderList(data) {
        const container = document.getElementById('listContainer');
        container.innerHTML = '';

        data.forEach((item) => {
            // Detección de Novedades/Reclamaciones para el punto rojo
            const hasReclamacion = (item.linkReclamacion && item.linkReclamacion.length > 5);
            const hasNovA = (item.novAsamblea && item.novAsamblea.trim() !== '');
            const hasNovC = (item.novConcejo && item.novConcejo.trim() !== '');
            const hasAlert = hasReclamacion || hasNovA || hasNovC;

            const card = document.createElement('div');
            card.className = 'card';
            
            // Construcción HTML Tarjeta
            let alertHtml = hasAlert ? `<span class="alert-dot" title="Tiene reclamación o novedad"></span>` : '';

            card.innerHTML = `
                <div class="card-header">
                    <span class="badge">Puesto: ${item.puesto}</span>
                    <span class="badge mesa-badge">Mesa ${item.mesa}</span>
                </div>
                <div class="card-main-row">
                    <div class="card-title">${item.nombre}</div>
                    ${alertHtml}
                </div>
                <small style="color:var(--text-light); margin-top:5px; display:block;">Ver detalles &rarr;</small>
            `;
            card.onclick = () => openModal(item);
            container.appendChild(card);
        });
    }

    // --- 4. Buscador ---
    document.getElementById('searchInput').addEventListener('keyup', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allData.filter(item => 
            (item.puesto && item.puesto.toLowerCase().includes(term)) ||
            (item.nombre && item.nombre.toLowerCase().includes(term)) ||
            (item.mesa && item.mesa.includes(term)) ||
            (item.codigo && item.codigo.toLowerCase().includes(term))
        );
        renderList(filtered);
    });

    // --- 5. Funciones de Modal y PDF ---
    function getEmbedLink(link) {
        if (!link) return null;
        try {
            // Conversión para preview de Drive
            if (link.includes('id=')) {
                const id = link.split('id=')[1].split('&')[0];
                return `https://drive.google.com/file/d/${id}/preview`;
            }
            if (link.includes('/d/')) {
                return link.replace('/view', '/preview').replace('/open', '/preview');
            }
        } catch (e) { return link; }
        return link;
    }

    function renderPDFContainer(containerId, originalLink) {
        const container = document.getElementById(containerId);
        container.innerHTML = ''; 

        if (!originalLink || originalLink.length < 5) {
            container.innerHTML = '<div class="fallback-link"><p>No hay documento disponible.</p></div>';
            return;
        }

        const embedUrl = getEmbedLink(originalLink);

        const fallback = `
            <div class="fallback-link" style="background:#fff; color:#333; border-bottom:1px solid #eee;">
                Si el documento no carga, <a href="${originalLink}" target="_blank" class="btn-link">Abrir en nueva pestaña</a>
            </div>
        `;
        
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        
        container.innerHTML = fallback;
        container.appendChild(iframe);
    }

    function openModal(item) {
        // Llenar textos
        document.getElementById('modalTitle').innerText = item.nombre;
        document.getElementById('mZona').innerText = item.zona || '-';
        document.getElementById('mPuesto').innerText = item.puesto || '-';
        document.getElementById('mMesa').innerText = item.mesa || '-';
        
        const txtNovA = item.novAsamblea || 'Sin novedades reportadas';
        const txtNovC = item.novConcejo || 'Sin novedades reportadas';
        
        document.getElementById('novAsamblea').innerText = txtNovA;
        document.getElementById('novConcejo').innerText = txtNovC;

        // Mostrar alerta interna si hay reclamación
        const hasReclamacion = (item.linkReclamacion && item.linkReclamacion.length > 5);
        document.getElementById('reclamoContainer').style.display = hasReclamacion ? 'block' : 'none';

        // Cargar PDFs
        renderPDFContainer('tabE14Concejo', item.linkConcejo);
        renderPDFContainer('tabE14Asamblea', item.linkAsamblea);
        renderPDFContainer('tabReclamacion', item.linkReclamacion);

        // Reset Tab
        openTab('tabE14Concejo');
        document.getElementById('modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('modal').style.display = 'none';
        document.getElementById('tabE14Concejo').innerHTML = '';
        document.getElementById('tabE14Asamblea').innerHTML = '';
        document.getElementById('tabReclamacion').innerHTML = '';
    }

    window.onclick = function(event) {
        if (event.target == document.getElementById('modal')) closeModal();
    }

    window.openTab = function(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        // Buscar botón activo
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            if(btn.getAttribute('onclick').includes(tabId)) btn.classList.add('active');
        });
    }

    // Iniciar App
    fetchData();

</script>
</body>
</html>
